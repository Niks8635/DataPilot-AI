version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datapilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot_password
      POSTGRES_DB: datapilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datapilot_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://datapilot:datapilot_password@postgres:5432/datapilot_db
      SECRET_KEY: datapilot-production-secure-random-key-32chars
      AI_PROVIDER: auto
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAX_UPLOAD_SIZE_MB: 100
      SANDBOX_TIMEOUT_SECONDS: 5
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datapilot_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
